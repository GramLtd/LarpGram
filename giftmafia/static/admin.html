<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>GiftMafia — админка</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@700;800&display=swap">
<style>
:root{--bg:#121329;--card:#1f2142;--card2:#2a2c55;--line:#ffffff14;--mut:#9fa2cc;--acc1:#4f7bff;--acc2:#8b5cff;--grad:linear-gradient(90deg,var(--acc1),var(--acc2));--ok:#3ee08f;--bad:#ff5a6e;--gold:#ffc83d}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{background:radial-gradient(700px 360px at 50% -140px,#5b46d455,transparent 70%) no-repeat,var(--bg);color:#fff;font:600 15px/1.4 "Manrope",-apple-system,system-ui,sans-serif;max-width:860px;margin:auto;padding:0 16px 60px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc1);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:14px 16px 12px;margin:0 -16px;background:#121329d9;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.logo{font:800 22px/1 "Unbounded",system-ui;letter-spacing:-.03em}.logo b{background:linear-gradient(180deg,#ffe07a,#f3a514);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:#ffffff14;color:var(--mut)}
.sp{flex:1}
.btn{height:44px;padding:0 18px;border-radius:999px;background:var(--grad);font-weight:800;box-shadow:0 8px 22px -10px #6c63ffaa}
.btn.ghost{background:var(--card2);box-shadow:none}.btn.ok{background:linear-gradient(90deg,#20b56b,#3ee08f)}.btn.bad{background:#ff5a6e2e;color:#ffb0ba;box-shadow:none}
.btn.sm{height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.5}
.glass{position:relative;display:flex;gap:2px;padding:5px;border-radius:999px;margin-top:6px;background:linear-gradient(180deg,#ffffff1f,#ffffff08 45%,#ffffff0d);background-color:#1a1b3a8c;
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid #ffffff2b;box-shadow:inset 0 1px 0 #ffffff59,0 12px 40px #0006}
.glass{overflow-x:auto;scrollbar-width:none}.glass::-webkit-scrollbar{display:none}
.glass button{position:relative;z-index:1;flex:1 0 auto;min-width:0;padding:0 14px;height:42px;border-radius:999px;color:var(--mut);font-weight:800;font-size:14px;transition:color .2s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:420px){.glass{gap:0;padding:4px}.glass .lens{top:4px;bottom:4px}.glass button{font-size:13px;padding:0 12px}}
.set{display:grid;gap:10px}.set label{display:grid;gap:6px;font-size:13px;color:var(--mut)}.set .inp{color:#fff}
.tk{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tk .nm{flex:1;min-width:160px}.tk .nm b{display:block}.tk .nm small{color:var(--mut);word-break:break-all}
.kind{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:#ffffff14;color:#cfd2ff}
.sw{width:46px;height:28px;border-radius:999px;background:#ffffff1f;position:relative;flex:none;transition:background .2s}.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--ok)}.sw.on:after{transform:translateX(18px)}
.glass button.on{color:#fff}
.lens{position:absolute;top:5px;bottom:5px;left:0;border-radius:999px;background:linear-gradient(180deg,#ffffff2e,#ffffff0f);border:1px solid #ffffff38;
  box-shadow:inset 0 1px 0 #ffffff80,0 6px 18px -6px #6c63ffaa;transition:transform .45s cubic-bezier(.3,1.35,.4,1),width .45s cubic-bezier(.3,1.35,.4,1)}
h2{font:800 22px "Unbounded",system-ui;margin:26px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h2 small{font:700 14px "Manrope";color:var(--mut)}
.card{background:linear-gradient(180deg,#24264d,#1b1c3a);border:1px solid var(--line);border-radius:22px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat small{display:block;color:var(--mut);font-size:13px}.stat b{display:block;font:800 26px "Unbounded",system-ui;margin-top:6px;white-space:nowrap}
.stat b.pos{color:var(--ok)}.stat b.neg{color:var(--bad)}
.list{display:grid;gap:10px}
.req{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.req img,.pz img{width:48px;height:48px;object-fit:contain;flex:none}
.req .who{flex:1;min-width:160px}.req .who b{display:block}.req .who small{color:var(--mut)}
.req a{color:#a9a4ff;text-decoration:none}
.st{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap}
.st.requested{background:#ffc83d26;color:var(--gold)}.st.sent{background:#3ee08f26;color:var(--ok)}.st.rejected{background:#ff5a6e26;color:var(--bad)}
.acts{display:flex;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{height:38px;padding:0 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;color:#d9daf0}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.case{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;width:100%;text-align:left}
.ch .t{flex:1;min-width:0}.ch .t b{display:block;font-size:16px}.ch .t small{color:var(--mut)}
.rtp{font-weight:800;font-size:13px;padding:5px 10px;border-radius:999px;background:#ffffff12}
.rtp.hi{color:var(--bad)}.rtp.lo{color:var(--ok)}
.arrow{transition:transform .25s;color:var(--mut)}.case.open .arrow{transform:rotate(90deg)}
.cb{display:none;border-top:1px solid var(--line);padding:12px 16px 16px}.case.open .cb{display:block}
.price{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.inp{height:40px;border-radius:12px;background:#ffffff0d;border:1px solid var(--line);padding:0 12px;min-width:0}
.inp.n{width:96px}
.pz{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pzc{display:flex;align-items:center;gap:8px}
.pz:last-of-type{border:0}
.pz .nm{flex:1;min-width:0}.pz .nm b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pz .nm small{color:var(--mut)}
.pz .coin{width:48px;height:48px;display:grid;place-items:center;font-size:26px;flex:none}
.pc{width:64px;text-align:right;font-weight:800;color:#d9daf0;font-size:13px}
.x{width:36px;height:36px;border-radius:50%;background:#ff5a6e1f;color:#ffb0ba;font-size:18px;flex:none}
.add{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed #ffffff26}
.empty{color:var(--mut);padding:10px 2px}
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:360px;margin:auto;text-align:center}
.login .logo{font-size:34px;margin-bottom:6px}
.login .inp{height:52px;font-size:16px;text-align:center}
#toast{position:fixed;left:16px;right:16px;top:14px;max-width:480px;margin:auto;background:#2c2e52;border:1px solid #ffffff26;padding:13px 16px;border-radius:16px;display:none;z-index:20;font-weight:700;box-shadow:0 10px 30px #000a}
@media(max-width:520px){.pz .nm{flex:1 1 calc(100% - 60px)}.pzc{width:100%;padding-left:58px}.pzc .inp{flex:1}.pc{width:52px}.req .acts{width:100%}.req .acts .btn{flex:1}}
.stat em{display:block;font-style:normal;color:var(--mut);font-size:12px;margin-top:4px}
.chart{position:relative;margin-top:6px}.chart svg{display:block;width:100%;overflow:visible}.chart .ax{fill:#9fa2cc;font:700 11px Manrope,system-ui}
.chart .bar rect{transition:opacity .15s}.chart .bar.dim rect{opacity:.45}
.tip{position:absolute;top:-6px;display:none;pointer-events:none;background:#2c2e52;border:1px solid #ffffff26;border-radius:12px;padding:6px 10px;box-shadow:0 8px 20px #0008;white-space:nowrap}
.tip small{display:block;color:var(--mut);font-size:11px}.tip b{font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.two{grid-template-columns:1fr}}
.tbl{padding:4px 16px}.tr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.tr:last-child{border:0}
.tr>span:first-child{flex:1;min-width:0;font-weight:800;overflow:hidden;text-overflow:ellipsis}.tr>span{color:var(--mut);white-space:nowrap}.tr b{white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.urow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;text-align:left;width:100%}.uav{width:42px;height:42px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;flex:none}
.urow .who{flex:1;min-width:160px}.urow .who b{display:block}.urow .who b small,.urow .who>small{color:var(--mut);font-weight:600}
.nums{display:flex;gap:14px}.nums span{display:flex;flex-direction:column;font-weight:800;font-size:14px;white-space:nowrap}.nums small{color:var(--mut);font-size:11px;font-weight:700}
@media(max-width:520px){.nums{width:100%;justify-content:space-between}}
.bk{margin-top:16px}
.lnk{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}.lnk code{flex:1;min-width:0;font:12px ui-monospace,monospace;color:#c9cbe4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:10px 12px;border-radius:12px;background:#ffffff0a}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}.kp span{border-radius:14px;background:#ffffff08;padding:8px 10px}.kp small{display:block;color:var(--mut);font-size:11px}.kp b{font-size:15px}
.shots{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px}.shots img{height:180px;border-radius:12px;border:1px solid var(--line);display:block}
.cmrep .acts{flex-wrap:wrap}
.rst{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:12px 16px}.rst span{flex:1;min-width:180px;color:var(--mut);font-size:14px}
.epk{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.epk span,.epk button{position:relative;width:52px;height:52px;border-radius:12px;background:#ffffff0d;display:grid;place-items:center}
.epk img{width:40px;height:40px;object-fit:contain}.epk i{position:absolute;right:2px;bottom:0;font-style:normal;font-size:13px}
.epk.big button{width:64px;height:64px}.epk.big img{width:50px;height:50px}.epk.big button:hover{background:#ffffff26}
.eus{display:grid;gap:6px;margin-top:8px}.eu{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:12px;background:#ffffff08}
.eu b{font-size:22px;width:30px;text-align:center}.eu span{color:var(--mut)}.eu img{width:32px;height:32px;object-fit:contain}.eu em{color:var(--mut);font-style:normal;font-size:13px;flex:1}
.eu img+small,.eu img+button{margin-left:auto}.eu small{color:var(--gold);font-size:12px}.eu .btn{margin-left:auto}.eu small+.btn{margin-left:8px}.eu.no{background:#ffc83d12}
.epick{position:fixed;inset:0;z-index:50;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}.epick .card{max-width:520px;width:100%;max-height:80vh;overflow:auto}
.eadd{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:8px;margin-top:8px;max-width:100%}.eadd .btn{padding:0 12px}.eadd .inp{min-width:0}#eaE{text-align:center;font-size:20px}
.grr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}@media(max-width:560px){.grr{grid-template-columns:1fr}}
.list>*{min-width:0}.req .lnk{min-width:0}.req .lnk code{min-width:0;flex:1 1 120px}
.cri{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:800 24px Manrope;flex:none;background:#0098EA33;color:#5ac8ff}.cri.usdt{background:#26a17b33;color:#5ee0b0}
.mtc.on{border-color:#ff5a6e66;box-shadow:0 0 0 1px #ff5a6e33}
.bcbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.bcbar button{height:36px;min-width:40px;padding:0 10px;border-radius:10px;background:#ffffff0d;font-weight:800}
.bcbar button:hover{background:#ffffff1f}.bcta{width:100%;min-height:170px;height:auto;padding:12px;resize:vertical;font:600 14px/1.5 ui-monospace,Menlo,monospace;color:#fff}
.bcbtn{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 44px 36px;grid-template-areas:"t t i x" "k s s s" "u u u u";gap:6px;align-items:center;margin-top:6px}
.bcbtn select{padding:0 6px 0 8px}.bcbtn+.bcbtn{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.bcbtn [data-f=text]{grid-area:t}.bcbtn [data-f=kind]{grid-area:k}.bcbtn [data-f=style]{grid-area:s}.bcbtn [data-f=url]{grid-area:u}.bcbtn .ico{grid-area:i}.bcbtn .x{grid-area:x}
.bcbtn .ico{height:40px;border-radius:12px;background:#ffffff0d;display:grid;place-items:center}.bcbtn .ico img{width:26px;height:26px;object-fit:contain}
.bcrow{padding:10px;border-radius:14px;background:#ffffff06;border:1px dashed #ffffff1f;margin-top:8px}.bcrow>small{color:var(--mut);font-size:12px}
.tgv{background:#0e1621;border-radius:18px;padding:12px;max-width:420px}.tgm{background:#182533;border-radius:14px;overflow:hidden;color:#f5f5f5;font:500 15px/1.4 -apple-system,system-ui,sans-serif}
.tgm img.ph{display:block;width:100%;max-height:320px;object-fit:cover}.tgm .tx{padding:8px 12px 10px;white-space:pre-wrap;word-break:break-word}
.tgm blockquote{display:block;border-left:3px solid #6ab3f3;background:#6ab3f31a;border-radius:4px;padding:2px 8px;margin:2px 0;white-space:pre-wrap}.tgm a{color:#6ab3f3}
.tgm code{font-family:ui-monospace,monospace;background:#ffffff14;border-radius:4px;padding:0 3px}.tgm .sp{background:#ffffff40;color:transparent;border-radius:4px}
.tgm img.ce{width:20px;height:20px;vertical-align:-4px;object-fit:contain}.tgk{display:grid;gap:4px;margin-top:4px}.tgk div{display:flex;gap:4px}
.tgk span{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border-radius:10px;background:#2b5278cc;color:#fff;font:600 14px system-ui;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 8px}
.tgk span.primary{background:#3e88f7}.tgk span.success{background:#2fb35a}.tgk span.danger{background:#e5484d}.tgk img{width:20px;height:20px;object-fit:contain}
.bch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.bch{min-width:0}.bch .nm{flex:1 1 180px;min-width:0}.bch .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bch .nm small{color:var(--mut)}
.prog{height:6px;border-radius:9px;background:#ffffff14;overflow:hidden;width:100%}.prog i{display:block;height:100%;background:var(--grad)}
</style></head><body>
<div id="app"></div><div id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Math.round(n).toLocaleString('ru-RU');
const toast=t=>{const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)};
const CAT={free:'Бесплатный',change:'На сдачу',theme:'Тематический',fifty:'50/50',premium:'Премиум',coll:'Коллекция'};
let T='';try{T=localStorage.adm||''}catch(e){}
let view='stats',reqF='requested',open=new Set(),CATALOG=[],D={},PQ='',POWN=0,PR=null;
async function api(p,m='GET',b){const r=await fetch('/api/admin/'+p,{method:m,headers:{'X-Admin':T,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
  if(r.status==401){logout();throw new Error('Неверный токен')}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||'Ошибка');return j}
function logout(){T='';try{localStorage.removeItem('adm')}catch(e){}renderLogin()}
function renderLogin(){$('app').innerHTML=`<div class="login"><div class="logo">Gift<b>Mafia</b></div><p style="color:var(--mut)">Вход в админку</p>
  <input class="inp" id="tok" type="password" placeholder="Токен администратора" autocomplete="current-password"><button class="btn" id="go">Войти</button></div>`;
  const go=async()=>{T=$('tok').value.trim();if(!T)return;try{await api('stats');try{localStorage.adm=T}catch(e){}start()}catch(e){toast(e.message)}};
  $('go').onclick=go;$('tok').onkeydown=e=>{if(e.key=='Enter')go()};$('tok').focus()}
function moveLens(){const bar=document.querySelector('.glass'),on=bar?.querySelector('button.on'),l=bar?.querySelector('.lens');if(on&&l){l.style.width=on.offsetWidth+'px';l.style.transform=`translateX(${on.offsetLeft}px)`;bar.scrollTo({left:on.offsetLeft-bar.clientWidth/2+on.offsetWidth/2,behavior:'smooth'})}}
addEventListener('resize',moveLens);
function start(){$('app').innerHTML=`<header class="top"><span class="logo">Gift<b>Mafia</b></span><span class="tag">админка</span><span class="sp"></span><button class="btn ghost sm" id="out">Выйти</button></header>
  <nav class="glass" id="nav"><i class="lens"></i><button data-v="stats">Дашборд</button><button data-v="users">Игроки</button><button data-v="req">Заявки</button><button data-v="cm">Комменты</button><button data-v="cases">Кейсы</button><button data-v="prices">Цены</button><button data-v="utm">UTM</button><button data-v="promo">Промокоды</button><button data-v="bc">Рассылка</button><button data-v="tasks">Настройки</button></nav><main id="main"></main>`;
  $('out').onclick=logout;$$('#nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
  fetch('/static/gifts.json').then(r=>r.json()).then(g=>CATALOG=g).catch(()=>{});
  load()}
async function load(){try{const [s,r,p]=await Promise.all([api('stats'),api('requests'),api('prizes')]);D={s,r,p};render()}catch(e){toast(e.message)}}
function render(){$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==view));requestAnimationFrame(moveLens);
  const M=$('main');if(!D.s)return;
  if(view=='stats'){renderDash()}
  if(view=='users'){renderUsers()}
  if(view=='cm'){M.innerHTML='<p class="empty">Загрузка…</p>';renderCmAdmin()}
  if(view=='utm'){M.innerHTML='<p class="empty">Загрузка…</p>';renderUtm()}
  if(view=='promo'){M.innerHTML='<p class="empty">Загрузка…</p>';renderPromos()}
  if(view=='req'){const all=D.r,list=reqF=='all'?all:reqF=='crypto'?all.filter(w=>w.kind=='ton'||w.kind=='usdt'):all.filter(w=>w.status==reqF);
    const amt=(v,c)=>(c=='USDT'?(+v).toFixed(2):String(+(+v).toFixed(3))).replace('.',',');
    const user=w=>w.username?`<a href="https://t.me/${esc(w.username)}" target="_blank" rel="noopener">@${esc(w.username)}</a>`:`<a href="tg://user?id=${w.user_id}">${esc(w.name||w.user_id)}</a>`;
    M.innerHTML=`<h2>Заявки на вывод<small>${all.filter(w=>w.status=='requested').length} ждут</small></h2>
      <div class="chips">${[['requested','Ждут'],['crypto','TON / USDT'],['sent','Отправлены'],['rejected','Отклонены'],['all','Все']].map(([k,t])=>`<button class="chip ${reqF==k?'on':''}" data-f="${k}">${t}</button>`).join('')}</div>
      <div class="list">${list.map(w=>{const cr=w.kind=='ton'||w.kind=='usdt';return `<div class="card req">${cr?`<span class="cri ${w.kind}">${w.cur=='TON'?'💎':'$'}</span>`:w.img?`<img src="${esc(w.img)}" alt="">`:''}
        <div class="who">${cr?`<b>${amt(w.net,w.cur)} ${w.cur} <small style="color:var(--mut);font-weight:700">сеть TON</small></b><small>#${w.wd} · ${w.src=='gift'?'подарок '+esc(w.prize):'с баланса'} · ${num(w.value)} ⭐ · сумма ${amt(w.amount,w.cur)} − комиссия ${amt(w.fee,w.cur)} · ${user(w)}</small>`
          :`<b>${esc(w.prize)}</b><small>#${w.wd} · ≈ ${num(w.value)} ⭐ · ${user(w)}</small>`}</div>

  const y=val=>pt+(H-pt-pb)*(1-(val-mn)/((Math.ceil(mx/step)*step-mn)||1)),top=Math.ceil(mx/step)*step,grid=[];
  for(let g=Math.floor(mn/step)*step;g<=top+1e-9;g+=step)grid.push(g);

function tgHtml(html){/* безопасный предпросмотр: только теги, которые понимает Telegram */
  const d=new DOMParser().parseFromString('<div>'+html+'</div>','text/html').body.firstChild,OK={B:'b',STRONG:'b',I:'i',EM:'i',U:'u',INS:'u',S:'s',STRIKE:'s',DEL:'s',CODE:'code',PRE:'code',BLOCKQUOTE:'blockquote'};
  const walk=n=>[...n.childNodes].map(c=>{if(c.nodeType==3)return esc(c.textContent);if(c.nodeType!=1)return '';const t=c.tagName,inner=walk(c);
    if(t=='TG-EMOJI'){const x=EI[c.getAttribute('emoji-id')];return x&&x.thumb?`<img class="ce" src="${efile(x.thumb)}" alt="${esc(c.textContent)}">`:inner}
    if(t=='TG-SPOILER'||(t=='SPAN'&&c.classList.contains('tg-spoiler')))return `<span class="sp">${inner}</span>`;
    if(t=='A')return `<a href="${esc(c.getAttribute('href')||'')}" target="_blank" rel="noopener">${inner}</a>`;
    if(t=='BR')return '\n';return OK[t]?`<${OK[t]}>${inner}</${OK[t]}>`:inner}).join('');
  return walk(d).replace(/<\/blockquote>\n/g,'</blockquote>').replace(/\n<blockquote>/g,'<blockquote>')}

    <div class="add"><select class="inp" name="kind" data-kind><option value="nft">NFT</option><option value="stars">⭐ на баланс</option></select>
      <span class="nf" style="display:contents"><input class="inp" name="gift" list="gl" placeholder="Коллекция" data-c="${c.id}"><input class="inp" name="model" list="ml${c.id}" placeholder="Модель"><datalist id="ml${c.id}"></datalist></span>
      <input class="inp" name="stars" type="number" placeholder="Сколько ⭐" style="display:none"><input class="inp" name="weight" type="number" step="any" placeholder="Вес" value="1">
      <button class="btn sm" data-addto="${c.id}">Добавить приз</button></div></div></div>`}
T?start():renderLogin();
</script></body></html>
