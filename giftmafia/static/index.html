<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GiftMafia</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@700;800&display=swap">
<style>
:root{--bg:#121329;--bg2:#1a1b36;--card:#1f2142;--card2:#2a2c55;--line:#ffffff14;--txt:#fff;--mut:#9fa2cc;--acc1:#4f7bff;--acc2:#8b5cff;
--grad:linear-gradient(90deg,var(--acc1),var(--acc2));--ok:#3ee08f;--bad:#ff5a6e;--gold:#ffc83d;
--hd:800 26px/1.1 "Unbounded",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
button,a,input,label,.cell{touch-action:manipulation}
body{background:radial-gradient(700px 360px at 50% -140px,#5b46d455,transparent 70%) no-repeat,var(--bg);color:var(--txt);font:600 15px/1.35 "Manrope",-apple-system,system-ui,sans-serif;padding:0 16px 120px;max-width:520px;margin:auto;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc1);outline-offset:2px}
img{-webkit-user-drag:none;user-select:none}
.st{width:1em;height:1em;vertical-align:-.12em;flex:none}
/* шапка */
.top{position:fixed;top:0;left:0;right:0;max-width:520px;margin:auto;z-index:15;display:flex;align-items:center;gap:8px;padding:12px 16px 10px;background:#121329d9;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transform:translateZ(0)}
body{padding-top:68px!important}
.logo{font:800 23px/1 "Unbounded",system-ui,sans-serif;letter-spacing:-.03em;margin-right:auto;white-space:nowrap}.logo b{background:linear-gradient(180deg,#ffe07a,#f3a514);-webkit-background-clip:text;background-clip:text;color:transparent}
.bal{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px 0 6px;border-radius:999px;background:#13142299;border:1px solid var(--line);font-weight:800;font-size:17px}
.bal .ic{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3d63,#22233a);display:grid;place-items:center;font-size:20px}
.bal svg.ch{width:14px;height:14px;opacity:.7}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:60px;border-radius:999px;background:var(--grad);font:800 18px "Manrope",system-ui,sans-serif;color:#fff;box-shadow:0 10px 30px -10px #6c63ffaa,inset 0 1px 0 #ffffff40;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.sm{width:auto;height:46px;padding:0 18px;font-size:16px}
.btn.sm.plus{width:46px!important;padding:0!important;flex:none}.btn.plus svg{width:22px;height:22px}
.bal{min-width:0}#balv{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.ghost{background:var(--card2);box-shadow:inset 0 1px 0 #ffffff14}
.btn.green{background:linear-gradient(90deg,#20b56b,#3ee08f);box-shadow:0 10px 30px -12px #3ee08faa}
.ava{width:46px;height:46px;border-radius:50%;background:var(--card2) center/cover;flex:none;display:grid;place-items:center;font-weight:800;border:2px solid #ffffff1c}
/* live */
.live{display:flex;gap:8px;margin:4px -16px 0;padding:0 16px;overflow-x:auto;scrollbar-width:none}.live::-webkit-scrollbar{display:none}
.ltag{flex:none;width:30px;border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:800 11px "Unbounded";letter-spacing:.1em;color:var(--mut)}
.ltag span{writing-mode:vertical-rl;transform:rotate(180deg)}.ltag i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.lc{flex:none;display:flex;align-items:center;gap:8px;height:60px;padding:0 14px 0 8px;border-radius:16px;background:linear-gradient(180deg,#2b2d58,#212246);border:1px solid var(--line);border-bottom:2px solid #6d74b8}
.lc.t3{border-bottom-color:#ff5a6e}.lc.t2{border-bottom-color:#d35bd6}.lc.t1{border-bottom-color:#8b6cff}
.lc img,.lc .coin{width:44px;height:44px;object-fit:contain}.lc div{display:flex;flex-direction:column;gap:2px}
.lc small{display:flex;align-items:center;gap:5px;color:var(--mut);font-size:12px;white-space:nowrap}.lc small i{width:18px;height:18px;border-radius:50%;background:var(--acc2);font:800 10px/18px "Manrope";text-align:center;font-style:normal;color:#fff}
.lc b{color:var(--ok);font-weight:800;font-size:16px;white-space:nowrap}
/* чипсы */
.chips{display:flex;gap:8px;margin:14px -16px 0;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none;align-items:center}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:#d9daf0;font-weight:700;font-size:16px;white-space:nowrap}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 18px -8px #6c63ff}
.chip.ic{width:44px;padding:0;display:grid;place-items:center}.chip svg{width:20px;height:20px}
.search{display:none;margin-top:10px}.search.on{display:block}
.inp{width:100%;height:48px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:#fff;font:700 16px "Manrope";padding:0 16px}
.inp::placeholder{color:var(--mut)}
h2{font:var(--hd);margin:26px 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h2 small{font:700 15px "Manrope";color:var(--mut);white-space:nowrap}
/* карточки кейсов */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:stretch}
.cc{display:flex;flex-direction:column;width:100%;min-width:0;text-align:left;border-radius:26px;padding:8px;background:linear-gradient(180deg,#25274e,#1c1d3c);border:1px solid var(--line);transition:transform .12s}
.cc:active{transform:scale(.97)}
.cov{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 50%,var(--gl,#6c63ff66),transparent 62%),linear-gradient(160deg,#2a2c48,#14152a)}
.cov:after{content:"";position:absolute;inset:-35%;animation:spin 40s linear infinite;background:conic-gradient(from 0deg,transparent 0 10%,#ffffff0c 12% 14%,transparent 16% 35%,#ffffff0a 37% 40%,transparent 42% 60%,#ffffff0c 62% 65%,transparent 67% 85%,#ffffff08 87% 90%,transparent 92%)}
.cov img{position:absolute;object-fit:contain;filter:drop-shadow(0 6px 10px #000a);z-index:1}
.cov .cg{position:absolute;left:22%;top:22%;width:56%;height:56%;border-radius:50%;background:var(--gl);filter:blur(22px);opacity:.9;z-index:1;animation:pulse 3.2s ease-in-out infinite}
.cov .m{width:60%;height:60%;left:20%;top:19%;z-index:3;filter:drop-shadow(0 10px 14px #000b);animation:fl2 4s ease-in-out infinite}
@keyframes fl2{50%{transform:translateY(-4px)}}
.cov .a,.cov .b,.cov .c,.cov .d{z-index:2;filter:drop-shadow(0 6px 8px #000a) saturate(.95);opacity:.95}
.cov img.ld{opacity:.95}.cov .m.ld{opacity:1}
.cov .a{width:30%;height:30%;left:4%;top:5%;transform:rotate(-14deg)}.cov .b{width:28%;height:28%;right:5%;top:4%;transform:rotate(12deg)}
.cov .c{width:28%;height:28%;left:5%;bottom:4%;transform:rotate(10deg)}.cov .d{width:30%;height:30%;right:4%;bottom:5%;transform:rotate(-10deg)}
.cov .coin{position:absolute;width:56%;height:56%;left:22%;top:22%;z-index:2}
.cf{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px 6px 4px;margin-top:auto}
.cf b{width:100%;font-weight:800;font-size:16px;line-height:1.15;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr{flex:none;display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 13px;border-radius:999px;background:var(--grad);font-weight:800;font-size:16px;white-space:nowrap;box-shadow:0 6px 16px -8px #6c63ff}
.pr.free{background:linear-gradient(90deg,#20b56b,#3ee08f)}.pr.wait{background:var(--card2);color:var(--mut);box-shadow:none;font-variant-numeric:tabular-nums}
/* экран кейса */
.panel{background:linear-gradient(180deg,#24264d,#1b1c3a);border:1px solid var(--line);border-radius:30px;padding:16px;margin-top:8px}
.ph{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.ph .cov{width:84px;flex:none;border-radius:20px}.ph h1{font:800 26px/1.1 "Unbounded",system-ui,sans-serif;min-width:0}
.reels{display:flex;flex-direction:column;gap:8px;margin:0 -16px;padding:0 16px}
.reel{position:relative;overflow:hidden;height:186px;border-radius:18px;background:#15162699}
.reels.m .reel{height:112px}
.reel:before,.reel:after{content:"";position:absolute;left:50%;margin-left:-10px;border:10px solid transparent;z-index:3}
.reel:before{top:0;border-top:12px solid #fff;border-bottom:0}.reel:after{bottom:0;border-bottom:12px solid #fff;border-top:0}
.strip{display:flex;height:100%;padding:6px 0;will-change:transform}
.it{flex:0 0 150px;margin:0 5px;border-radius:22px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px 8px 14px;overflow:hidden;
  background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid #ffffff1a;border-bottom:3px solid var(--c3)}
.it img,.it .coin{position:absolute;left:12%;top:8%;width:76%;height:68%;object-fit:contain;filter:drop-shadow(0 6px 8px #0008)}
.it span{position:relative;font-size:14px;font-weight:800;text-align:center;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 4px #000a}
.reels.m .it{flex-basis:96px;border-radius:16px;padding-bottom:8px}.reels.m .it span{font-size:11px}
.it.hit{box-shadow:0 0 0 2px #fff,0 0 30px var(--c3)}
.t0{--c1:#2d3e78;--c2:#232a4f;--c3:#4f7dff}.t1{--c1:#4a3592;--c2:#2c2457;--c3:#8b6cff}.t2{--c1:#7a2f7f;--c2:#3f2050;--c3:#e05ce2}.t3{--c1:#8c2c3f;--c2:#4a1d2b;--c3:#ff5a6e}.ts{--c1:#3a3a52;--c2:#26273d;--c3:#ffc83d}
.ctl{display:flex;gap:6px;margin-top:14px}
.rb{flex:1 1 0;min-width:0;max-width:54px;height:44px;border-radius:14px;background:var(--card2);border:1px solid var(--line);color:var(--mut);font-weight:800;font-size:16px;display:grid;place-items:center}
.rb.on{background:var(--grad);color:#fff;border-color:transparent}.rb svg{width:22px;height:22px}
.cta{margin-top:16px}
/* что может выпасть */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pc{position:relative;min-width:0;border-radius:22px;padding:10px 10px 12px;background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid #ffffff1a;border-bottom:3px solid var(--c3);text-align:left;display:flex;flex-direction:column}
.pc .pi{aspect-ratio:1.15;display:grid;place-items:center}.pc img,.pc .coin{width:84%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 8px #0008)}
.pc b{font-size:13.5px;line-height:1.2;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.pc em{font-style:normal;font-weight:800;font-size:16px;display:flex;align-items:center;gap:4px;margin-top:6px}
.pc .ch{position:absolute;top:8px;right:9px;font-size:11px;color:#ffffffb0;font-weight:700}
/* оверлеи */
.ov{position:fixed;left:0;right:0;top:0;height:var(--tg-viewport-height,100vh);background:var(--bg);z-index:20;overflow-y:auto;display:none;padding:0 16px calc(40px + env(safe-area-inset-bottom,0px))}
.ov.on{display:block;animation:up .22s ease-out}.ov.z2{z-index:25}.ov.z3{z-index:28}.ov.z4{z-index:30}
.ovi{max-width:520px;margin:auto}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.bar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;padding:12px 0;background:var(--bg)}
.bar h3{font:800 20px "Unbounded",system-ui;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}.x svg{width:20px;height:20px}
/* таббар */
.glass{position:relative;isolation:isolate;background:linear-gradient(180deg,#ffffff1f,#ffffff08 45%,#ffffff0d);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid #ffffff2b;
  box-shadow:inset 0 1px 0 #ffffff59,inset 0 -1px 0 #ffffff14,inset 0 0 24px #ffffff0a,0 12px 40px #0009}
.glass:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 80% at 20% -20%,#ffffff26,transparent 55%),radial-gradient(90% 70% at 100% 120%,#8b5cff26,transparent 60%)}
.lens{position:absolute;top:7px;bottom:7px;left:0;border-radius:999px;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,#ffffff2e,#ffffff0f);border:1px solid #ffffff38;
  box-shadow:inset 0 1px 0 #ffffff80,inset 0 -6px 14px #ffffff0d,0 6px 18px -6px #6c63ffaa;
  transition:transform .45s cubic-bezier(.3,1.35,.4,1),width .45s cubic-bezier(.3,1.35,.4,1)}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:496px;margin:auto;display:flex;gap:2px;padding:7px;border-radius:999px;z-index:18;
  background-color:#0b0c1fd9;transition:transform .3s ease,opacity .3s ease}
.tabs.glass{background-image:linear-gradient(180deg,#ffffff14,#ffffff05 45%,#ffffff08)}
body.kb .tabs{transform:translateY(140%);opacity:0;pointer-events:none}
.tabs button{position:relative;z-index:1;flex:1;height:58px;border-radius:999px;color:var(--mut);font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:color .2s,background .2s}
.tabs button svg{width:23px;height:23px;transition:transform .2s}
.tabs button.on{color:#fff}
.tabs button.on svg{color:#a9a4ff;transform:translateY(-1px)}
.tabs .fb{position:absolute;top:-6px;left:58%;background:var(--gold);color:#3a2600;font:800 10px/1 "Manrope";padding:4px 7px;border-radius:7px;letter-spacing:.05em}
/* мины */
.gsw{display:flex;gap:2px;margin-top:6px;padding:5px;border-radius:999px;background-color:#1a1b3a8c}
.gsw .lens{top:5px;bottom:5px}
.gsw button{position:relative;z-index:1;flex:1 1 0;min-width:0;height:44px;border-radius:999px;color:var(--mut);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:7px;transition:color .2s}
.gsw button svg{width:19px;height:19px}.gsw button.on{color:#fff}
.gbar{display:flex;align-items:center;gap:6px;margin-top:12px}
.gbar .ib{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:#d9daf0;flex:none}.gbar .ib.on{color:var(--gold)}.gbar .ib svg{width:26px;height:26px}
.mults{position:relative;flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;padding:0 8px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 10px),transparent);mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 10px),transparent)}.mults::-webkit-scrollbar{display:none}
.mu{flex:none;height:42px;padding:0 12px;border-radius:12px;background:#ffffff08;display:flex;align-items:center;gap:6px;font:800 16px "Unbounded",system-ui;color:#d3d4ea}
.mu small{font:700 12px "Manrope";color:var(--mut);display:flex;align-items:center;gap:2px}.mu.on{background:#2c2e52;box-shadow:inset 0 0 0 1.5px #6d74b8;color:#fff}.mu.done{color:var(--ok)}
.maxw{color:var(--mut);font-size:14px;margin:10px 0 0 2px;display:flex;align-items:center;gap:4px}
.field{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px auto 0;max-width:310px}
.cell{aspect-ratio:1;border-radius:14px;background:linear-gradient(180deg,#3a3c5c,#2c2d48);box-shadow:inset 0 1px 0 #ffffff1c,0 4px 0 #1a1b2e,0 6px 12px #0006;display:grid;place-items:center;font-size:30px;transition:transform .12s,background .2s}
.cell:active{transform:translateY(2px)}.cell:disabled{cursor:default}
.cell.sel{box-shadow:inset 0 0 0 2px var(--acc1),0 4px 0 #1a1b2e}
.cell svg{width:62%;height:62%}.cnt svg{width:24px;height:24px}
.cell.gem{background:linear-gradient(180deg,#1f6b55,#174a3e)}.cell.bomb{background:linear-gradient(180deg,#8c2c3f,#4a1d2b)}
.cell.dim{opacity:.45}
@keyframes pop{from{transform:scale(.8)}to{transform:none}}
.box{margin-top:12px;background:#ffffff06;border:1px solid var(--line);border-radius:22px;padding:6px;display:flex;align-items:center;gap:6px}
.seg button{flex:1;height:52px;border-radius:16px;color:var(--mut);font-weight:800;font-size:17px}.seg button.on{background:#43455f;color:#fff}
.bet{flex:1;display:flex;align-items:center;gap:10px;padding-left:12px;font:800 22px "Manrope";min-width:0}.bet input{width:100%;min-width:0;background:none;border:0;color:#fff;font:inherit}
.sb{height:46px;min-width:50px;padding:0 12px;border-radius:14px;background:#ffffff0a;color:#c9cbe4;font-weight:800;font-size:16px;flex:none}
.row2{display:flex;gap:10px}.row2 .box{flex:1;margin-top:10px}
.cnt{flex:1;min-width:0;white-space:nowrap;text-align:center;font:800 22px "Unbounded",system-ui;display:flex;align-items:center;justify-content:center;gap:6px}
.gsel{flex:1;display:flex;align-items:center;gap:10px;padding:4px 8px;text-align:left;min-width:0}.gsel img{width:44px;height:44px;object-fit:contain}.gsel b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gsel small{color:var(--mut)}
/* апгрейд */
.upw{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin-top:12px}.upw>button{display:block;width:100%}
.slot{width:100%;min-width:0;aspect-ratio:.72;border-radius:24px;background:linear-gradient(180deg,#2a2c55,#1d1e3d);border:1px dashed #ffffff30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center}
.slot.full{border-style:solid;background:linear-gradient(180deg,var(--c1),var(--c2));border-color:#ffffff1a;border-bottom:3px solid var(--c3)}
.slot img,.slot .coin{width:78%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 6px 8px #0008)}.slot b{font-size:13px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot small{color:var(--mut);font-size:12px}
.slot em{font-style:normal;font-weight:800;display:flex;align-items:center;gap:3px}
.gauge{position:relative;width:130px;height:130px}.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .pt{position:absolute;inset:0;transition:transform 0s}.gauge .pt:before{content:"";position:absolute;left:50%;top:-4px;margin-left:-7px;border:7px solid transparent;border-top:14px solid #fff;filter:drop-shadow(0 2px 4px #000)}
.gauge .pc2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 24px "Unbounded",system-ui}.gauge .pc2 small{font:700 12px "Manrope";color:var(--mut)}
.gauge.win .pc2{color:var(--ok)}.gauge.lose .pc2{color:var(--bad)}
.ks{display:flex;gap:6px;margin-top:12px}.ks button{flex:1;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:800;color:#d9daf0}
/* плинко */
.plb{position:relative;margin:14px -4px 0;border-radius:24px;background:radial-gradient(circle at 50% 0,#3b3a8a55,transparent 70%),linear-gradient(180deg,#1d1f40,#16172f);border:1px solid var(--line);padding:10px 4px 10px}
.plb canvas{display:block;width:100%}
.plh{display:flex;gap:6px;min-height:30px;margin-top:10px;overflow:hidden}
.plh span{flex:none;padding:6px 10px;border-radius:10px;font-weight:800;font-size:13px;color:#2a1600;background:var(--sc);box-shadow:inset 0 1px 0 #ffffff40}.plh span:first-child{animation:popin .45s cubic-bezier(.2,1.5,.4,1)}
/* заработок: ник */
.nk{margin-top:8px;background:radial-gradient(120% 90% at 0 0,#2b6fd640,transparent 60%),linear-gradient(180deg,#24264d,#1b1c3a);border-color:#4f9dff40}

const GEM='<svg viewBox="0 0 24 24"><path d="M7 3h10l4 6-9 12L3 9z" fill="#5ff2c3"/><path d="M3 9h18M7 3l5 6 5-6M12 9v12" stroke="#1d8f6f" stroke-width="1.2" fill="none" stroke-linejoin="round"/><path d="M7 3 3 9h4.5z" fill="#b8ffe9" opacity=".7"/></svg>';

let S=null,CAT=[],FL={},VAL={},TS=69,left=0,filt='all',asc=true,query='',tab='cases';

async function api(p,m='GET',body){const r=await fetch('/api/'+p,{method:m,headers:{'X-Init':tg.initData,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||'Ошибка');return j}
const fmt=s=>[s/3600|0,(s%3600)/60|0,s%60].map(x=>String(x).padStart(2,'0')).join(':');
const num=n=>Math.round(n).toLocaleString('ru-RU');

const valOf=p=>p.stars??p.value;
const tierV=(v,base)=>{const r=v/Math.max(base,1);return r>=10?3:r>=3?2:r>=1?1:0};
const tierP=pm=>pm<=5?3:pm<=10?2:pm<=20?1:0;
const pct=(p,c)=>{const t=c.prizes.reduce((a,x)=>a+x.weight,0),v=p.weight/t*100;return (v<0.01?'<0.01':v<1?v.toFixed(2):v<10?v.toFixed(1):Math.round(v))+'%'};
const nftVal=(g,m)=>VAL[g]?.[m]??0; // цены моделей приходят с сервера (/api/catalog)

/* звук */
let AC;const ac=()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();return AC}catch(e){return null}};
function tone(f,{d=.12,v=.05,at=0,to=0}={}){if(!sound)return;const a=ac();if(!a)return;const t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
const SCALE=[0,2,4,7,9,12,14,16,19,21,24];
const sfx={tick:()=>tone(1400,{d:.03,v:.015}),pop:n=>tone(523.25*Math.pow(2,SCALE[Math.min(n,SCALE.length-1)]/12),{d:.16,v:.04}),
  win:()=>[523.25,659.25,783.99].forEach((f,i)=>tone(f,{d:.4,v:.035,at:i*.08})),lose:()=>tone(240,{d:.3,v:.04,to:120}),
  big:()=>[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,{d:.6,v:.035,at:i*.09}))};

/* ---------- кейсы ---------- */
const CATS=[['all','Все'],['free','Бесплатные'],['change','На сдачу'],['theme','Тематические'],['fifty','50/50'],['premium','Премиум'],['coll','Коллекции']];
const CAT_T={free:'Бесплатные',change:'На сдачу',theme:'Тематические',fifty:'50/50',premium:'Премиум',coll:'Коллекции'};
const CAT_GL={free:'#3ee08f55',change:'#8b6cff66',theme:'#e05ce266',fifty:'#ffc83d55',premium:'#ff5a6e55',coll:'#4f9dff66'};
function renderChips(){$('chips').innerHTML=`<button class="chip ic" id="sbtn" aria-label="Поиск">${IC.search}</button>`+
  CATS.map(([k,t])=>`<button class="chip ${filt==k?'on':''}" data-f="${k}">${t}</button>`).join('')+
  `<button class="chip" id="allnft">Все NFT</button><button class="chip ic" id="sort" aria-label="Сортировка по цене">${IC.sort}</button>`;
  $$('#chips [data-f]').forEach(b=>b.onclick=()=>{filt=b.dataset.f;renderChips();renderCases()});
  $('sort').onclick=()=>{asc=!asc;renderCases()};$('allnft').onclick=()=>openCatalog();
  $('sbtn').onclick=()=>{$('search').classList.toggle('on');if($('search').classList.contains('on'))$('q').focus()}}
$('q').oninput=e=>{query=e.target.value.trim().toLowerCase();renderCases()};
function cover(c){const n=[...c.prizes.filter(p=>p.kind=='nft')].sort((a,b)=>b.stars-a.stars),seen=new Set(),ps=[];
  for(const p of n){const k=c.cat=='coll'?p.model:p.gift;if(!seen.has(k)){seen.add(k);ps.push(p)}if(ps.length==5)break}
  const gl=CAT_GL[c.cat]||'#6c63ff66';
  if(!ps.length)return `<div class="cov" style="--gl:${gl}">${COIN}</div>`;
  const cls=['m','a','b','c','d'];return `<div class="cov" style="--gl:${gl}"><i class="cg"></i>${ps.map((p,i)=>`<img class="${cls[i]}" src="${esc(imgOf(p,i?128:256))}" alt="" loading="lazy" decoding="async">`).join('')}</div>`}
let balShown=0;
function setBal(v){const el=$('balv'),from=balShown;balShown=v;const big=num(v).length>6,t=$('top');
  if(t.classList.contains('plus')!==big){t.classList.toggle('plus',big);t.innerHTML=big?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>':'Пополнить';t.setAttribute('aria-label','Пополнить')}if(from===v){el.textContent=num(v);return}
  const b=$('bal');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');const t0=performance.now(),d=600;
  (function f(t){if(balShown!==v)return;const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=num(from+(v-from)*e);if(k<1)requestAnimationFrame(f)})(t0)}

const plural=(n,a,b,c)=>n%10==1&&n%100!=11?a:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?b:c;
function pill(c){return isFree(c)?(left>0?`<span class="pr wait" data-fp>${fmt(left)}</span>`:`<span class="pr free">Бесплатно</span>`):`<span class="pr">${num(c.price)} ${STAR}</span>`}

  let cs=S.cases.filter(c=>!query||c.title.toLowerCase().includes(query)||c.prizes.some(p=>(p.gift+' '+p.model).toLowerCase().includes(query)))

  const groups=filt=='all'?Object.keys(CAT_T).map(k=>[k,cs.filter(c=>c.cat==k)]):[[filt,cs.filter(c=>c.cat==filt)]];

/* ---------- экран кейса (используется и во вкладке «Бонусы») ---------- */
function CaseView(root,c,inline){this.root=root;this.c=c;this.mult=1;this.spinning=false;this.inline=inline;this.render()}
CaseView.prototype.q=function(s){return this.root.querySelector(s)};
const preload=urls=>Promise.all([...new Set(urls)].filter(Boolean).map(u=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=u})));
CaseView.prototype.render=function(){const c=this.c,me=this;
  this.root.innerHTML=`${inline_bar(this.inline,c)}
  <div class="panel"><div class="ph">${cover(c)}<h1>${esc(c.title)}</h1></div>
  <div class="reels" data-r></div>
  <button class="btn cta" data-go></button>
  <div class="ctl">${isFree(c)?'':[1,2,3,4,5].map(n=>`<button class="rb ${n==1?'on':''}" data-n="${n}">x${n}</button>`).join('')}
    <button class="rb ${fast?'on':''}" data-fast aria-label="Быстрое открытие">${IC.bolt}</button><button class="rb" data-fair aria-label="Честная игра">${IC.shield}</button><button class="rb" data-snd aria-label="Звук">${sound?IC.snd:IC.mute}</button></div>
  ${isFree(c)?'<p class="maxw" style="justify-content:center">Подарок дня можно открыть раз в 24 часа</p>':''}</div>
  <h2>Что может выпасть<small>${c.prizes.length}</small></h2>
  <div class="grid3">${c.prizes.map(p=>`<div class="pc ${p.kind=='stars'?'ts':'t'+tierV(p.stars,c.price||5)}"><span class="ch">${pct(p,c)}</span><div class="pi">${pic(p)}</div><b>${title(p)}</b><em>${num(p.stars)} ${STAR}</em></div>`).join('')}</div>`;
  const x=this.q('[data-x]');if(x)x.onclick=closeCase;
  this.q('[data-go]').onclick=()=>this.go();
  $$('[data-n]',this.root).forEach(b=>b.onclick=()=>{if(me.spinning)return;me.mult=+b.dataset.n;$$('[data-n]',me.root).forEach(z=>z.classList.toggle('on',z==b));me.build(me.mult);me.refresh()});
  this.q('[data-fast]').onclick=e=>{fast=!fast;save();e.currentTarget.classList.toggle('on',fast)};
  this.q('[data-snd]').onclick=e=>{sound=!sound;save();e.currentTarget.innerHTML=sound?IC.snd:IC.mute};
  this.q('[data-fair]').onclick=fairInfo;
  this.build(1);this.refresh();preload(c.prizes.filter(p=>p.kind=='nft').map(p=>imgOf(p)))};
function inline_bar(inline,c){return inline?'':`<div class="bar"><button class="x" data-x aria-label="Закрыть">${IC.x}</button><h3>${esc(c.title)}</h3></div>`}
CaseView.prototype.card=function(p){return `<div class="it ${p.kind=='stars'?'ts':'t'+tierV(valOf(p),this.c.price||5)}">${pic(p)}<span>${p.kind=='stars'?num(valOf(p))+' '+STAR:esc(p.gift||p.name)}</span></div>`};
CaseView.prototype.build=function(n,items){const el=this.q('[data-r]');el.className='reels'+(n>1?' m':'');const pool=this.c.prizes;
  const base=items||[...Array(24)].map((_,i)=>pool[i%pool.length]);
  el.innerHTML=[...Array(n)].map(()=>`<div class="reel"><div class="strip">${base.map(p=>this.card(p)).join('')}</div></div>`).join('');
  $$('.strip',el).forEach(st=>{const it=st.children[0],w=it.offsetWidth+10,k=Math.min(6,base.length-1);st.style.transform=`translateX(${-(k*w+w/2-st.parentElement.clientWidth/2+5)}px)`})};
CaseView.prototype.refresh=function(){const b=this.q('[data-go]'),c=this.c;if(!b)return;
  if(this.spinning){b.disabled=true;return}

function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}

        `<div class="grid3">${shown.map((p,i)=>`<button class="pc t${tierP(p.pm)}" data-i="${i}"><span class="ch">${(p.pm/10).toLocaleString('ru-RU')}%</span><div class="pi"><img src="${esc(imgOf(p))}" alt="" loading="lazy" decoding="async"></div><b>${catColl?esc(p.model):esc(p.gift)+' · '+esc(p.model)}</b><em>${num(p.value)} ${STAR}</em></button>`).join('')}</div>`+(ms.length?'':'<p class="empty">Ничего не нашлось.</p>');
      $$('[data-i]',L).forEach(b=>b.onclick=()=>{const p=shown[+b.dataset.i];if(catPick){catPick(p);$('ovCat').classList.remove('on');afterClose()}})}
    else{const gs=[...CAT].sort((a,b)=>(FL[b.name]??4.5)-(FL[a.name]??4.5));
      L.innerHTML=`<div class="grid3">${gs.map((g,i)=>{const m=g.models[g.models.length-1];return `<button class="coll" data-c="${esc(g.name)}"><div class="pi"><img src="${esc(mimg(g.name,m[0]))}" alt="" loading="lazy" decoding="async"></div><b>${esc(g.name)}</b><small>от ${num(Math.min(...g.models.map(x=>nftVal(g.name,x[0]))))} ${STAR}</small><small>${g.models.length} ${plural(g.models.length,'модель','модели','моделей')}</small></button>`}).join('')}</div>`;
      $$('[data-c]',L).forEach(b=>b.onclick=()=>{catColl=CAT.find(g=>g.name==b.dataset.c);renderCat();$('ovCat').scrollTop=0})}}}

/* ---------- профиль и инвентарь ---------- */
function openProfile(){$('ovProf').classList.add('on');document.body.style.overflow='hidden';renderProfile();try{tg.BackButton.show()}catch(e){}}
function renderProfile(){if(!$('ovProf').classList.contains('on'))return;const u=tg.initDataUnsafe?.user||{},inv=S?.inventory||[],act=inv.filter(w=>w.status=='locked'||w.status=='ready');
  if(!setHTML($('profIn'),`<div class="bar"><button class="x" id="pX" aria-label="Закрыть">${IC.x}</button><h3>Профиль</h3></div>
  <div class="prof"><div class="ava" style="${u.photo_url?`background-image:url('${esc(u.photo_url)}')`:''}">${u.photo_url?'':esc((u.first_name||'?')[0])}</div><div><b>${esc(u.first_name||'Игрок')}</b><div class="big" style="font-size:22px;margin-top:4px">${num(S.balance)} ${STAR}</div></div></div>
  <div class="row2" style="margin-top:14px"><button class="btn" id="pTop">Пополнить</button><button class="btn ghost" id="pCat">Все NFT</button></div>
  <h2>Инвентарь<small>${act.length} ${plural(act.length,'подарок','подарка','подарков')} · ${num(act.reduce((a,w)=>a+w.value,0))} ${STAR}</small></h2>
  <div class="inv">${inv.map(invCard).join('')||'<p class="empty">Пока пусто — откройте кейс или сыграйте.</p>'}</div>
  <p class="credit">Данные NFT: thanks to <a href="https://t.me/GiftChanges" target="_blank" rel="noopener">GiftChanges</a></p>`))return;
  $('pX').onclick=closeProf;$('pTop').onclick=()=>openTop();$('pCat').onclick=()=>openCatalog();
  $$('#profIn [data-a]').forEach(b=>b.onclick=()=>act_(b.dataset.a,+b.dataset.w,b))}
function closeProf(){$('ovProf').classList.remove('on');afterClose()}
function invCard(w){const st={sent:'Отправлен',requested:'Ждёт отправки'}[w.status];let body='';
  if(w.status=='locked'){const s=w.story_at>0,fr=w.shares;
    body=`<ul><li class="${s?'ok':''}">Сторис</li><li class="${fr>=S.need?'ok':''}">Друзьям ${fr}/${S.need}</li></ul>
    <button class="btn ghost" data-a="story" data-w="${w.id}">${s?'Сторис ещё раз':'В сторис'}</button>
    <button class="btn ghost" data-a="friend" data-w="${w.id}" ${fr>=S.need?'disabled':''}>Другу</button>
    <button class="btn" data-a="withdraw" data-w="${w.id}" ${s&&fr>=S.need?'':'disabled'}>Вывести</button>`}
  else if(w.status=='ready')body=`<button class="btn" data-a="withdraw" data-w="${w.id}">Вывести</button><button class="btn ghost" data-a="sell" data-w="${w.id}">Продать ${num(Math.floor(w.value*S.sell_rate))} ${STAR}</button>`;
  else body=`<span class="tag">${st||''}</span>`;
  return `<div class="iv t${tierV(w.value,300)}"><div class="pi"><img src="${esc(imgOf(w))}" alt="" loading="lazy"></div><b>${esc(w.gift)}</b><span class="tag">${esc(w.model)}</span><em>${num(w.value)} ${STAR}</em>${body}</div>`}
async function act_(a,id,b){try{b.disabled=true;
  if(a=='story'){const w=S.inventory.find(x=>x.id==id);
    tg.shareToStory(w.story_url,{text:`Я выиграл ${w.gift} в GiftMafia`,widget_link:{url:`https://t.me/${S.bot}`,name:'GiftMafia'}});await api(`win/${id}/story`,'POST')}
  if(a=='friend'){if(!tg.isVersionAtLeast('8.0')){b.disabled=false;return toast('Обновите Telegram')}
    const {id:mid}=await api(`win/${id}/prepare`,'POST');tg.shareMessage(mid,async ok=>{if(ok){await api(`win/${id}/shared`,'POST');await load()}})}
  if(a=='withdraw'){await api(`win/${id}/withdraw`,'POST');toast('Заявка отправлена. Подарок отправит админ.')}
  if(a=='sell'){const r=await api(`win/${id}/sell`,'POST');toast(`+${num(r.amount)} ${STAR} на баланс`);hap('ok')}
  await load()}catch(e){toast(e.message);b.disabled=false}}
function pickInv(cb){const inv=(S?.inventory||[]).filter(w=>w.status=='ready');
  if(!inv.length){toast('В инвентаре нет подарков — откройте кейс');return}
  sheet(`<h4>Выберите подарок</h4><div class="inv">${inv.map(w=>`<button class="iv t${tierV(w.value,300)}" data-p="${w.id}" style="text-align:left"><div class="pi"><img src="${esc(imgOf(w))}" alt="" loading="lazy"></div><b>${esc(w.gift)}</b><span class="tag">${esc(w.model)}</span><em>${num(w.value)} ${STAR}</em></button>`).join('')}</div>`);
  $$('#sheetIn [data-p]').forEach(b=>b.onclick=()=>{closeSheet();cb(inv.find(w=>w.id==+b.dataset.p))})}

/* ---------- шторки ---------- */
function sheet(h){$('sheetIn').innerHTML=h;$('sheet').style.display='flex'}
function closeSheet(){$('sheet').style.display='none'}
$('sheet').onclick=e=>{if(e.target==$('sheet'))closeSheet()};
function openTop(need){closeSheet();const mn=S?.topup_min||50,mx=S?.topup_max||10000,pre=[50,100,250,500,1000,2500];
  $('topIn').innerHTML=`<div class="bar"><button class="x" id="tX" aria-label="Закрыть">${IC.x}</button><h3>Пополнить баланс</h3></div>
  <div class="card" style="margin-top:4px"><p style="color:var(--mut)">Сейчас на балансе</p><div class="big">${num(S?.balance||0)} ${STAR}</div>
   ${need?`<p style="color:var(--gold);margin-top:6px">Не хватает ${num(need)} ${STAR}</p>`:''}</div>
  <label class="amt">${STAR}<input id="tAmt" inputmode="numeric" pattern="[0-9]*" placeholder="Сумма" value="${need?Math.max(mn,Math.ceil(need)):''}" aria-label="Сумма пополнения" enterkeyhint="done"></label>
  <p class="maxw">От ${num(mn)} до ${num(mx)} ${STAR}</p>
  <div class="presets">${pre.map(a=>`<button data-p="${a}">${STAR} ${num(a)}</button>`).join('')}</div>
  <button class="btn" id="tGo" style="margin-top:18px"></button>
  <p class="maxw" style="justify-content:center">Оплата через Telegram Stars, звёзды приходят на баланс сразу</p>`;
  const inp=$('tAmt'),go=$('tGo'),val=()=>parseInt(inp.value.replace(/\D/g,''))||0;
  const upd=()=>{const v=val();inp.value=v?String(v):'';$$('#topIn [data-p]').forEach(b=>b.classList.toggle('on',+b.dataset.p==v));
    go.disabled=v<mn||v>mx;go.innerHTML=v>mx?`Максимум ${num(mx)} ${STAR}`:v?`Пополнить на ${num(v)} ${STAR}`:'Введите сумму'};
  inp.oninput=upd;inp.onkeydown=e=>{if(e.key=='Enter'){inp.blur();go.click()}};
  $$('#topIn [data-p]').forEach(b=>b.onclick=()=>{inp.value=b.dataset.p;upd();hap()});
  $('tX').onclick=closeTop;
  go.onclick=async()=>{const v=val();if(v<mn||v>mx)return;go.disabled=true;
    try{const {link}=await api('topup/'+v,'POST');tg.openInvoice(link,s=>{go.disabled=false;if(s=='paid'){toast(`Баланс пополнен на ${num(v)} ${STAR}`);sfx.win();closeTop();setTimeout(load,1500)}})}
    catch(e){toast(e.message);go.disabled=false}};
  upd();$('ovTop').classList.add('on');$('ovTop').scrollTop=0;document.body.style.overflow='hidden';try{tg.BackButton.show()}catch(e){}}
function closeTop(){$('ovTop').classList.remove('on');afterClose()}
function fairInfo(){const g=M.g;sheet(`<h4>Честная игра</h4><p>Исход определяется на сервере криптостойким генератором до вашего хода. В минах сервер заранее показывает SHA-256 от поля и секрета, а после игры раскрывает их — можно проверить, что поле не менялось.</p>
  ${g?`<p>Игра #${g.id}: хеш <code>${g.hash}</code></p>${g.seed?`<p>Секрет <code>${esc(g.seed)}</code>, мины <code>${JSON.stringify(g.field)}</code><br>Проверка: sha256("${esc(g.seed)}:${JSON.stringify(g.field).replace(/,/g,', ')}")</p>`:''}`:''}
  <button class="btn" onclick="closeSheet()">Понятно</button>`)}
$('top').onclick=()=>openTop();$('bal').onclick=()=>openTop();$('ava').onclick=openProfile;
$('inv').onclick=async()=>{const l=`https://t.me/${S.bot}?startapp=r${S.uid}`,b=$('inv');
  const plain=()=>tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(l)}&text=${encodeURIComponent('🎁 Забирай NFT-подарки Telegram в GiftMafia! 📦 Кейсы, 💣 мины, 🚀 апгрейды и 🎉 подарок дня бесплатно')}`);
  if(!tg.isVersionAtLeast||!tg.isVersionAtLeast('8.0'))return plain();
  b.disabled=true;try{const {id}=await api('invite/prepare','POST');tg.shareMessage(id,ok=>{if(ok){toast('Приглашение отправлено');hap('ok')}})}catch(e){plain()}finally{b.disabled=false}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(`https://t.me/${S.bot}?startapp=r${S.uid}`);toast('Ссылка скопирована')}catch(e){toast('Не удалось скопировать')}};
function afterClose(){if(!$$('.ov.on').length){document.body.style.overflow='';try{tg.BackButton.hide()}catch(e){}}}
$('winfx').onclick=e=>{if(e.target.id=='winfx'||e.target.id=='wfIn'){$('winfx').classList.remove('on');confetti.stop&&confetti.stop()}};
try{tg.BackButton.onClick(()=>{if($('winfx').classList.contains('on')){$('winfx').classList.remove('on');confetti.stop&&confetti.stop()}else if($('ovTop').classList.contains('on'))closeTop();else if(catOn())closeCat();else if($('ovProf').classList.contains('on'))closeProf();else closeCase()})}catch(e){}
const catOn=()=>$('ovCat').classList.contains('on');

/* ---------- состояние ---------- */
const freeBadge=()=>{const b=document.querySelector('.tabs .fb');if(b)b.hidden=left>0};
async function load(){S=await api('state');left=S.free_in;freeBadge();
  setBal(S.balance);
  const u=tg.initDataUnsafe?.user;if(u){const a=$('ava');if(u.photo_url)a.style.backgroundImage=`url('${u.photo_url}')`;else a.textContent=(u.first_name||'?')[0]}
  if(M.g==null&&S.mines)M.g=S.mines;
  if(!$('chips').children.length)renderChips();
  renderCases();if(!M.busy)renderMines();if(!U.busy)renderUpgrade();if(!$('g-plinko').hidden)renderPlinko();renderProfile();
  if(tab=='bonus'&&!(BV&&BV.spinning))renderBonus();else renderTasks();renderNick();
  $('rb').innerHTML='+'+S.ref_bonus+' '+STAR;$('rp').textContent=S.ref_percent+'%';$('rn').textContent=S.refs;$('re').textContent=num(S.ref_earned);
  if(CV){CV.c=S.cases.find(c=>c.id==CV.c.id)||CV.c;CV.refresh()}
  return loadLive()}
setInterval(()=>{if(left>0){left--;if(left==0){freeBadge();renderCases();renderBonus()}else $$('[data-fp]').forEach(e=>e.textContent=fmt(left));CV&&CV.refresh();BV&&BV.refresh()}},1000);
const bootP=v=>{const b=$('bootp');if(b)b.style.width=v+'%'};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{const t0=Date.now();bootP(15);
  try{const [g,c]=await Promise.all([fetch('/static/gifts.json').then(r=>r.json()),fetch('/api/catalog').then(r=>r.json())]);CAT=g;TS=c.ton_stars;FL=c.floors_ton;for(const x of g)VAL[x.name]=Object.fromEntries(x.models.map(([m],i)=>[m,c.prices?.[x.name]?.[i]??0]))}catch(e){}
  bootP(40);
  try{await load()}catch(e){toast(e.message)}
  bootP(65);
  // ждём картинки первого экрана и шрифты, но не дольше 5 с
  const first=[...$$('#live img'),...$$('#cases img').slice(0,30)].map(i=>i.src);let done=0;
  await Promise.race([Promise.all([
    ...first.map(u=>new Promise(r=>{const i=new Image();i.onload=i.onerror=()=>{done++;bootP(65+30*done/first.length);r()};i.src=u})),
    document.fonts?document.fonts.ready:0]),wait(5000)]);
  bootP(100);await wait(Math.max(250,600-(Date.now()-t0)));
  document.body.classList.add('ready');$$('.glass').forEach(moveLens);setTimeout(()=>$('boot')?.remove(),600)})();
</script></body></html>
